Port 2205
Protocol 2
HostKey /etc/ssh/rsa1024
KexAlgorithms diffie-hellman-group1-sha1
Ciphers aes128-ctr,3des-cbc
MACs hmac-sha1
UsePrivilegeSeparation no
PasswordAuthentication yes
ChallengeResponseAuthentication no
PermitRootLogin no
UsePAM no
PidFile none
# Tests connect many at once; the default drops some of them.
MaxStartups 200

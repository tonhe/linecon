name: CI

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Empty except when building a tag, so release binaries name their release.
  LINECON_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, require_docker: "1" }
          - { name: linux-arm64, os: ubuntu-22.04-arm, require_docker: "1" }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: windows-x64, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    env:
      LINECON_REQUIRE_DOCKER: ${{ matrix.require_docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: bash
        run: |
          # An empty variable still counts as set for the skip check.
          if [ -z "$LINECON_REQUIRE_DOCKER" ]; then unset LINECON_REQUIRE_DOCKER; fi
          cargo test --workspace
      - name: Build release binary
        run: cargo build --release -p linecon
      - name: Smoke test release binary
        shell: bash
        run: target/release/linecon --version
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - name: Open the real window
        shell: bash
        run: packaging/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.name }}
          path: smoke-screen.png
          if-no-files-found: ignore
      - name: Package
        shell: bash
        # Tags only: nothing else needs these, and pull requests must never see them.
        env:
          MACOS_CERT_P12: ${{ github.ref_type == 'tag' && secrets.MACOS_CERT_P12 || '' }}
          MACOS_CERT_PASSWORD: ${{ github.ref_type == 'tag' && secrets.MACOS_CERT_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ github.ref_type == 'tag' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.ref_type == 'tag' && secrets.APPLE_API_ISSUER || '' }}
        run: packaging/package.sh "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linecon-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Only the builds: CI's screenshots are artifacts too.
          pattern: linecon-*
          path: dist
          merge-multiple: true
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          NOTARIZED: ${{ secrets.MACOS_CERT_P12 != '' && 'yes' || 'no' }}
        run: packaging/sign-update.sh dist "$GITHUB_REF_NAME" "$NOTARIZED"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --generate-notes

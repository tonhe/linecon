name: CI

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Empty except when building a tag, so release binaries name their release.
  LINECON_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Only a tagged build has a real version, which turns on update checks.
      - name: Tests as a tagged build
        run: cargo test -p linecon --bin linecon --locked
        env:
          LINECON_RELEASE: v0.0.0-alpha.0
      - name: Licence notices are current
        run: python3 packaging/notices.py --check

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - name: Known vulnerabilities in dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, require_docker: "1" }
          - { name: linux-arm64, os: ubuntu-22.04-arm, require_docker: "1" }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: windows-x64, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    env:
      LINECON_REQUIRE_DOCKER: ${{ matrix.require_docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      # A signed build starts from clean, with nothing carried over from another run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: github.ref_type != 'tag'
      - name: Test
        shell: bash
        run: |
          # An empty variable still counts as set for the skip check.
          if [ -z "$LINECON_REQUIRE_DOCKER" ]; then unset LINECON_REQUIRE_DOCKER; fi
          cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --release --locked -p linecon
      - name: Smoke test release binary
        shell: bash
        run: target/release/linecon --version
      - name: Command-line tests against the release binary
        # The protocol tests above run a debug build; this is the one that ships.
        if: runner.os == 'Linux'
        env:
          LINECON_TEST_BINARY: ${{ github.workspace }}/target/release/linecon
        run: cargo test --locked -p linecon --test cli_pty
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - name: Open the real window
        shell: bash
        run: packaging/smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screen-${{ matrix.name }}
          path: smoke-screen.png
          if-no-files-found: ignore
      - name: Package
        shell: bash
        # Mac jobs on tags only: nothing else needs these, and pull requests must never see them.
        env:
          MACOS_CERT_P12: ${{ github.ref_type == 'tag' && runner.os == 'macOS' && secrets.MACOS_CERT_P12 || '' }}
          MACOS_CERT_PASSWORD: ${{ github.ref_type == 'tag' && runner.os == 'macOS' && secrets.MACOS_CERT_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ github.ref_type == 'tag' && runner.os == 'macOS' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ github.ref_type == 'tag' && runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.ref_type == 'tag' && runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: packaging/package.sh "${{ matrix.name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linecon-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, audit, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only the builds: CI's screenshots are artifacts too.
          pattern: linecon-*
          path: dist
          merge-multiple: true
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          NOTARIZED: ${{ secrets.MACOS_CERT_P12 != '' && 'yes' || 'no' }}
        run: packaging/sign-update.sh dist "$GITHUB_REF_NAME" "$NOTARIZED"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --generate-notes

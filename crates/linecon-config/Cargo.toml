[package]
name = "linecon-config"
description = "Session tree, inheritance and persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.9"
argon2 = "0.5"
blowfish = { version = "0.9", features = ["bcrypt"] }
cbc = "0.2"
chacha20poly1305 = "0.10"
directories = "6"
getrandom = "0.4"
linecon-engine = { path = "../linecon-engine" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "0.9"
zeroize = "1"

# Pure Rust on Linux: linking libdbus would break the portable binary.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
bcrypt-pbkdf = "0.11"

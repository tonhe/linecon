[package]
name = "linecon-config"
description = "Session tree, inheritance and persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
directories = "6"
getrandom = "0.3"
linecon-engine = { path = "../linecon-engine" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
zeroize = "1"

# Pure Rust on Linux: linking libdbus would break the portable binary.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

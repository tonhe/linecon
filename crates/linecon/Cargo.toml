[package]
name = "linecon"
description = "A portable SSH, Telnet and serial client for network engineers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
linecon-engine = { path = "../linecon-engine" }
linecon-config = { path = "../linecon-config" }
alacritty_terminal = "0.26"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.37"
plist = "1"
serde_json = "1"
crossterm = "0.29"
directories = "6"
zeroize = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

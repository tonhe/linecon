[package]
name = "linecon"
description = "A portable SSH, Telnet and serial client for network engineers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
linecon-engine = { path = "../linecon-engine" }
linecon-config = { path = "../linecon-config" }
alacritty_terminal = "0.26"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wgpu", "x11", "wayland"] }
egui = "0.37"
plist = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "3", features = ["platform-verifier"] }
crossterm = "0.29"
directories = "6"
ed25519-dalek = "2"
flate2 = "1"
getrandom = "0.3"
zeroize = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }


[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
